global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: flower
    static_configs:
      - targets:
          - flower:5555

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
